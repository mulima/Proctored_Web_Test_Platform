<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ settings.brand }}{% endblock %}</title>
  <link rel="stylesheet" href="/static/css/app.css">
</head>
<body class="{% block body_class %}{% endblock %}">
  {% block chrome %}
  <header class="site">
    <div class="wrap">
      <a class="brand" href="/">{{ settings.brand }}</a>
      <span class="brand-sub">{{ settings.subtitle }}</span>
      <nav>{% block nav %}{% endblock %}</nav>
    </div>
  </header>
  {% endblock %}
  <main class="wrap">{% block content %}{% endblock %}</main>
  <footer class="site"><div class="wrap">
    {{ settings.footer }} &middot; <a href="/privacy">What this system records</a>
  </div></footer>
  {% block scripts %}{% endblock %}
</body>
</html>
