{% extends "base.html" %}
{% block content %}
<section class="card narrow">
  <h1>{% if ok %}Email confirmed{% else %}Link not valid{% endif %}</h1>
  <p>{{ message }}</p>
  {% if ok %}<p><a class="button primary" href="/login">Sign in</a></p>
  {% else %}<p><a class="button" href="/resend">Request a new link</a></p>{% endif %}
</section>
{% endblock %}
