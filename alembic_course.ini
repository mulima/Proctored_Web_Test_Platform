; Migrations for the COURSE schema - what a lecturer's OWN database needs.
;
; This is not run against the platform's own DATABASE_URL (see alembic.ini for
; that). It exists so the course schema documented in docs/DATABASE_SCHEMA.md
; can never drift from app/models_course.py, and so a lecturer comfortable
; with a dev environment can provision their database by running this instead
; of pasting raw SQL:
;
;   1. Edit sqlalchemy.url below to point at your own database.
;   2. alembic -c alembic_course.ini upgrade head
;
; This never runs automatically and is never pointed at this app's own
; deployment database.

[alembic]
script_location = alembic_course
prepend_sys_path = .
version_path_separator = os
sqlalchemy.url = postgresql+psycopg2://user:password@localhost:5432/your_course_db

[loggers]
keys = root,sqlalchemy,alembic
[handlers]
keys = console
[formatters]
keys = generic
[logger_root]
level = WARNING
handlers = console
qualname =
[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine
[logger_alembic]
level = INFO
handlers =
qualname = alembic
[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic
[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
